<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Blank character sheet</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap"><style id="css">
:root{--paper:#E2E5E8;--sheet:#F5F6F8;--ink:#1B2130;--muted:#586070;--line:#B0B6C0;--soft:#D5DAE0;--accent:#8C2A22;--accent-ink:#FFF6F3;--bronze:#7E6128;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121519;--sheet:#1A1E25;--ink:#E3E6EB;--muted:#9AA2AF;--line:#3A414D;--soft:#262B34;--accent:#E3806F;--accent-ink:#1A0E0C;--bronze:#CFA960;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121519;--sheet:#1A1E25;--ink:#E3E6EB;--muted:#9AA2AF;--line:#3A414D;--soft:#262B34;--accent:#E3806F;--accent-ink:#1A0E0C;--bronze:#CFA960;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.45 "Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sc{font-family:"Alegreya SC",Georgia,serif;letter-spacing:.03em}
.serif{font-family:"Alegreya",Georgia,serif}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar-name{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:1.15rem;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;order:3;width:100%}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:6px 4px;font-family:"Alegreya SC",Georgia,serif;font-size:1rem;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.savewrap{display:flex;align-items:center;gap:10px}
.status{font-size:.85rem;color:var(--muted)}
.status.dirty{color:var(--accent)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;padding:6px 14px;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media(min-width:760px){.tabs{order:0;width:auto}.tab{flex:none;padding:6px 14px}}

main{max-width:1180px;margin:0 auto;padding:14px 14px 60px}
.page[hidden]{display:none}

/* boxes */
.box{background:var(--sheet);border:1px solid var(--line);border-radius:12px 3px 12px 3px;display:flex;flex-direction:column;min-width:0}
.box>.body{padding:12px 14px;flex:1}
.lab{font-family:"Alegreya SC",Georgia,serif;font-size:.85rem;letter-spacing:.05em;color:var(--muted);text-align:center;border-top:1px solid var(--soft);padding:4px 8px 6px}

/* fields */
.fld{display:flex;flex-direction:column;min-width:0}
.fld input,.fld textarea,.fld select,.plain{background:transparent;border:0;border-bottom:1px solid var(--line);padding:4px 2px;width:100%;border-radius:0}
.fld textarea,textarea.plain{border:1px solid var(--soft);border-radius:6px;padding:8px;resize:vertical;line-height:1.45}
.fl{font-size:.78rem;color:var(--muted);font-family:"Alegreya SC",Georgia,serif;letter-spacing:.04em;padding-top:2px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* header */
.head{display:grid;gap:14px;grid-template-columns:1fr;margin-bottom:14px}
.cname input{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:2.4rem;line-height:1.1;border-bottom:2px solid var(--ink);padding:0 2px 4px}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
@media(min-width:760px){.head{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);align-items:end}.meta{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* sheet grid */
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media(min-width:760px){.grid{grid-template-columns:150px minmax(0,1fr)}.grid>.span2{grid-column:1/-1}}
@media(min-width:1060px){.grid{grid-template-columns:150px minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr)}.grid>.span2{grid-column:auto}}

/* abilities */
.abils{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(min-width:760px){.abils{grid-template-columns:1fr}}
.abil{background:var(--sheet);border:1px solid var(--line);border-radius:14px 14px 40px 40px/14px 14px 22px 22px;text-align:center;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center}
.abil .an{font-family:"Alegreya SC",Georgia,serif;font-size:.85rem;color:var(--muted)}
.abil .am{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:2.3rem;line-height:1;margin:2px 0 6px}
.abil input{width:3.2em;text-align:center;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:2px 0;font-weight:700}

/* small stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:10px;text-align:center;padding:8px 4px 4px;display:flex;flex-direction:column;justify-content:space-between}
.tile .big{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:1.9rem;line-height:1.1}
.tile input{text-align:center;border:0;background:transparent;width:100%;font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:1.9rem;line-height:1.1;padding:0}
.tile .fl{text-align:center}
.shield{border-radius:10px 10px 50% 50%/10px 10px 30% 30%}

.row2{display:flex;gap:10px;align-items:center}
.insp{display:flex;align-items:center;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.insp label{display:flex;align-items:center;gap:8px;font-family:"Alegreya SC",Georgia,serif}
.insp input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.profin{width:2.6em;text-align:center;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-weight:700;padding:2px 0}

/* checks */
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px dotted var(--soft)}
.checks li:last-child{border-bottom:0}
.checks input{width:18px;height:18px;accent-color:var(--ink);margin:0;flex:none}
.checks .v{width:2.4em;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.checks .ab{color:var(--muted);font-size:.85rem;margin-left:auto}
.checks label{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer}
.passive{display:flex;align-items:center;gap:12px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px}
.passive .big{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:1.4rem;width:2.2em;height:2.2em;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}

/* hp */
.hp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.hp .cur input{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:2.6rem;text-align:center;border-bottom:2px solid var(--ink)}
.hp .fld input{text-align:center}
.ds{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:.9rem}

/* pips */
.pips{display:inline-flex;gap:5px;flex-wrap:wrap;vertical-align:middle}.ds .pips{flex-wrap:nowrap}
.pip{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;padding:0}
.pip.on{background:var(--ink)}
.pips.red .pip{border-color:var(--accent)}.pips.red .pip.on{background:var(--accent)}

/* entries */
.list{display:flex;flex-direction:column}
.erow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--soft)}
.ename{background:none;border:0;padding:0;text-align:left;font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.ename:hover{color:var(--accent)}
.ename.norule{text-decoration-color:var(--line);font-weight:500}
.erow .atk{font-variant-numeric:tabular-nums;font-weight:700;margin-left:auto}
.erow .dmg{color:var(--muted);min-width:7.5em;text-align:right}
.erow .note{color:var(--muted);font-size:.88rem;font-style:italic}
.erow .pips{margin-left:auto}
.erow.spell input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin:0}
.add{background:none;border:1px dashed var(--line);border-radius:6px;color:var(--muted);padding:6px;margin-top:10px}
.add:hover{color:var(--ink);border-color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 6px}

.coins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.coins .fld input{text-align:center}
.coins .fl{text-align:center}

/* story */
.story{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.story{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}}
.phys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px}

/* spells */
.spellhead{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media(min-width:760px){.spellhead{grid-template-columns:2fr 1.3fr 1fr 1fr}}
.spellgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.spellgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1060px){.spellgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lvl summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px}
.lvl summary::-webkit-details-marker{display:none}
.lvl .ln{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:1.6rem;width:1.6em;height:1.6em;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;flex:none;line-height:1}
.lvl .lt{font-family:"Alegreya SC",Georgia,serif;flex:1}
.lvl .cnt{color:var(--muted);font-size:.85rem}
.lvl .body{padding-top:0}
.slots{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 4px;font-size:.9rem;color:var(--muted)}
.slots input{width:3em;text-align:center;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:1px 0;color:var(--ink);font-weight:700}

.foot{margin-top:28px;display:flex;justify-content:center}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--sheet);color:var(--ink);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 40px rgba(0,0,0,.25);animation:up .18s ease-out}
@media(min-width:700px){.ov{align-items:center;padding:20px}.modal{border-radius:14px 4px 14px 4px;max-height:84vh;animation:none}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.modal{animation:none}}
.mhead{display:flex;align-items:flex-start;gap:10px}
.mhead h2{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:1.75rem;line-height:1.15;margin:0;flex:1}
.x{background:none;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:1.2rem;line-height:1;flex:none}
.tag{color:var(--bronze);font-family:"Alegreya SC",Georgia,serif;margin:4px 0 0}
.mmeta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.9rem}
.chip b{font-variant-numeric:tabular-nums}
.rules{font-family:"Alegreya",Georgia,serif;font-size:1.05rem;line-height:1.6;margin-top:14px;border-top:1px solid var(--soft);padding-top:6px;max-width:62ch}
.rules p{margin:10px 0}
.empty{color:var(--muted);font-style:italic}
.mact{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.mact .sp{flex:1}
.form{display:grid;gap:12px;margin-top:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .form textarea{min-height:220px}
.msg{font-size:.88rem;color:var(--accent);min-height:1.2em}

pon mastery (2024)","text":"If your attack misses, the target still takes damage equal to the ability modifier you used for the attack. The damage can't be increased."},"longsword":{"name":"Longsword","tag":"Martial melee weapon","text":"Damage 1d8 slashing, or 1d10 when held in two hands (versatile). 3 lb.\n\nWeapon mastery (2024): Sap. A creature you hit has disadvantage on its next attack roll before the start of your next turn."},"shield":{"name":"Shield","tag":"Shield","text":"While holding a shield, your Armor Class increases by 2. You can't use a two-handed weapon while holding it. 6 lb."},"darkvision":{"name":"Darkvision","tag":"Trait","text":"You can see in dim light within range as if it were bright light, and in darkness as if it were dim light. You see only shades of gray in darkness."},"frightened":{"name":"Frightened","tag":"Condition","text":"Disadvantage on ability checks and attack rolls while the source of fear is within line of sight.\n\nThe creature can't willingly move closer to the source of its fear."},"prone":{"name":"Prone","tag":"Condition","text":"The creature can only crawl, or spend half its speed to stand up.\n\nDisadvantage on its attack rolls. Attacks against it have advantage within 5 feet, and disadvantage from farther away."},"concentration":{"name":"Concentration","tag":"Spellcasting rule","text":"You can concentrate on only one spell at a time; casting another concentration spell ends the first.\n\nWhen you take damage, make a Constitution save to keep concentrating: DC 10 or half the damage taken, whichever is higher (max 30). Concentration also ends if you are incapacitated or die."}}}</script><script id="app">

function norm(s){return String(s||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[x×]\s*\d+|\d+\s*[x×]/g,'').replace(/[^a-z0-9æøåäöüéè]/g,'')}
function ruleKey(name){const k=norm(name);if(!k)return null;const L=S.lib;if(L[k])return k;if(k.endsWith('s')&&L[k.slice(0,-1)])return k.slice(0,-1);for(const key in L){const aka=L[key].aka||[];if(aka.includes(k)||(k.endsWith('s')&&aka.includes(k.slice(0,-1))))return key}return null}
const rule=name=>{const k=ruleKey(name);return k?S.lib[k]:null};

function openEntry(key,idx,rr){
 const k=kindOf(key);let i=idx;let it=i<0?{name:''}:Object.assign({},gp(key)[i]);
 let ctrl=null;
 const m=h('div',{class:'modal',role:'dialog','aria-modal':'true','aria-labelledby':'mt'});
 const ov=h('div',{class:'ov',onclick:e=>{if(e.target===ov)close()}},m);

 function head(title){return h('div',{class:'mhead'},h('h2',{id:'mt'},title),h('button',{type:'button',class:'x',onclick:close,'aria-label':'Close'},'×'))}
 function view(){m.textContent='';const R=rule(it.name);
  m.append(head(it.name||'Untitled'));
  if(R&&R.tag)m.append(h('p',{class:'tag'},R.tag));
  const meta=[];
  if(k==='attacks'){if(it.bonus)meta.push(h('span',{class:'chip'},'Attack ',h('b',null,it.bonus)));if(it.damage)meta.push(h('span',{class:'chip'},'Damage ',h('b',null,it.damage)))}

  if(k==='spell'&&S.sp.ability){meta.push(h('span',{class:'chip'},'Spell save DC ',h('b',null,String(8+P()+M(S.sp.ability)))),h('span',{class:'chip'},'Spell attack ',h('b',null,sg(P()+M(S.sp.ability)))))}
  if(it.note)meta.push(h('span',{class:'chip'},it.note));
  if(meta.length)m.append(h('div',{class:'mmeta'},meta));
  m.append(h('div',{class:'rules'},R?paras(R.text):h('p',{class:'empty'},'No rules saved for this yet. Choose Edit to write them'+(SAMPLE?', or let Claude draft them.':'.'))));
  m.append(h('div',{class:'mact'},h('span',{class:'sp'}),h('button',{type:'button',class:'btn ghost',onclick:edit},R?'Edit':'Edit and add rules'),h('button',{type:'button',class:'btn',onclick:close},'Done')));
  m.querySelector('.x').focus()}

  m.append(head(isNew?KINDS[k].add:'Edit '+(it.name||'entry')));
  const nm=h('input',{type:'text',value:it.name||'',placeholder:'Name'});
  const R0=rule(it.name);
  const ta=h('textarea',{class:'plain',placeholder:'Rules text: what it does, range, duration, damage, uses…'});ta.value=R0?R0.text:'';
  const tag=h('input',{type:'text',placeholder:'e.g. Feat, Fighter level 2, 1st-level evocation'});tag.value=R0&&R0.tag?R0.tag:'';
  const L=(t,el)=>h('label',{class:'fld'},el,h('span',{class:'fl'},t));
  const f=h('div',{class:'form'},L('Name',nm));
  let bonus,dmg,uses,note;
  if(k==='attacks'){bonus=h('input',{type:'text',value:it.bonus||'',placeholder:'+7'});dmg=h('input',{type:'text',value:it.damage||'',placeholder:'2d6+5 slashing'});f.append(h('div',{class:'two'},L('Attack bonus',bonus),L('Damage / type',dmg)))}
  if(k==='features'||k==='equip'||k==='attacks'||k==='spell'){note=h('input',{type:'text',value:it.note||'',placeholder:k==='features'?'e.g. Carved on: sword':''});uses=h('input',{type:'text',inputmode:'numeric',value:it.uses||'',placeholder:'0'});f.append(h('div',{class:'two'},L('Note',note),k==='features'?L('Uses (tracker dots)',uses):h('span')))}
  f.append(L('Source / type',tag),L('Rules',ta));
  const msg=h('div',{class:'msg',role:'status'});
  const act=h('div',{class:'mact'});
  if(SAMPLE){const db=h('button',{type:'button',class:'btn ghost'},'Draft rules with Claude');db.addEventListener('click',async()=>{const name=nm.value.trim();if(!name){msg.textContent='Add a name first.';nm.focus();return}if(ctrl)ctrl.abort();ctrl=new AbortController();db.disabled=true;msg.textContent='Claude is writing…';const kind={attacks:'weapon or attack',features:'class feature, feat or trait',prof:'proficiency or language',equip:'item or piece of equipment',spell:'spell'}[k];const ctx='The character is: '+[S.f.race,S.f.classLevel].filter(Boolean).join(' ')+'.';try{const res=await SAMPLE('Write a short rules summary of the Dungeons & Dragons 5th edition '+kind+' called "'+name+'" for a player\'s character sheet. '+ctx+' Write it in your own words as plain text: no markdown, no headings, 2–4 short paragraphs separated by blank lines, under 170 words. Include the key numbers (action type, range, duration, damage, saving throw, uses, recovery). If the 2014 and 2024 rules differ meaningfully, note both briefly. If you are unsure what it is, say so in one sentence.',{signal:ctrl.signal,modelTier:'quick',cache:false,onText:x=>{ta.value=x.text}});ta.value=String(res.text||'').trim();msg.textContent='Check it against your books, then save.'}catch(e){const c=e&&e.code;if(c==='cancelled')return;if(e&&e.text)ta.value=e.text;if(c==='not_granted'){db.remove();msg.textContent='Claude drafting isn’t allowed in this view. Write the rules yourself.'}else if(c==='rate_limited')msg.textContent='Too many requests right now. Try again in a minute.';else msg.textContent='Couldn’t draft the rules. Try again or write them yourself.'}finally{db.disabled=false}});act.append(db)}
  act.append(h('span',{class:'sp'}));
  if(!isNew){let armed=false;const del=h('button',{type:'button',class:'btn danger'},'Delete');del.addEventListener('click',()=>{if(!armed){armed=true;del.textContent='Tap again to delete';return}const arr=gp(key);arr.splice(i,1);changed();rr();close()});act.append(del)}
  act.append(h('button',{type:'button',class:'btn ghost',onclick:()=>{if(ctrl)ctrl.abort();isNew?close():view()}},'Cancel'));
  act.append(h('button',{type:'button',class:'btn accent',onclick:()=>{

   it.name=name;if(bonus){it.bonus=bonus.value.trim();it.damage=dmg.value.trim()}if(note)it.note=note.value.trim()||undefined;if(k==='features'){it.uses=uses.value.trim();it.used=Math.min(n(it.used),n(it.uses))}
