<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Wood Elf Ranger</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap"><style id="css">
:root{--paper:#E2E5E8;--sheet:#F5F6F8;--ink:#1B2130;--muted:#586070;--line:#B0B6C0;--soft:#D5DAE0;--accent:#8C2A22;--accent-ink:#FFF6F3;--bronze:#7E6128;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121519;--sheet:#1A1E25;--ink:#E3E6EB;--muted:#9AA2AF;--line:#3A414D;--soft:#262B34;--accent:#E3806F;--accent-ink:#1A0E0C;--bronze:#CFA960;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121519;--sheet:#1A1E25;--ink:#E3E6EB;--muted:#9AA2AF;--line:#3A414D;--soft:#262B34;--accent:#E3806F;--accent-ink:#1A0E0C;--bronze:#CFA960;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.45 "Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sc{font-family:"Alegreya SC",Georgia,serif;letter-spacing:.03em}
.serif{font-family:"Alegreya",Georgia,serif}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar-name{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:1.15rem;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;order:3;width:100%}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:6px 4px;font-family:"Alegreya SC",Georgia,serif;font-size:1rem;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.savewrap{display:flex;align-items:center;gap:10px}
.status{font-size:.85rem;color:var(--muted)}
.status.dirty{color:var(--accent)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;padding:6px 14px;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media(min-width:760px){.tabs{order:0;width:auto}.tab{flex:none;padding:6px 14px}}

main{max-width:1180px;margin:0 auto;padding:14px 14px 60px}
.page[hidden]{display:none}

/* boxes */
.box{background:var(--sheet);border:1px solid var(--line);border-radius:12px 3px 12px 3px;display:flex;flex-direction:column;min-width:0}
.box>.body{padding:12px 14px;flex:1}
.lab{font-family:"Alegreya SC",Georgia,serif;font-size:.85rem;letter-spacing:.05em;color:var(--muted);text-align:center;border-top:1px solid var(--soft);padding:4px 8px 6px}

/* fields */
.fld{display:flex;flex-direction:column;min-width:0}
.fld input,.fld textarea,.fld select,.plain{background:transparent;border:0;border-bottom:1px solid var(--line);padding:4px 2px;width:100%;border-radius:0}
.fld textarea,textarea.plain{border:1px solid var(--soft);border-radius:6px;padding:8px;resize:vertical;line-height:1.45}
.fl{font-size:.78rem;color:var(--muted);font-family:"Alegreya SC",Georgia,serif;letter-spacing:.04em;padding-top:2px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* header */
.head{display:grid;gap:14px;grid-template-columns:1fr;margin-bottom:14px}
.cname input{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:2.4rem;line-height:1.1;border-bottom:2px solid var(--ink);padding:0 2px 4px}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
@media(min-width:760px){.head{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);align-items:end}.meta{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* sheet grid */
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
/* movable / resizable layout: bands of columns holding blocks; stacked below 900px */
.lay,.band{display:flex;flex-direction:column;gap:14px}
@media(min-width:900px){.band{display:grid;grid-template-columns:var(--cols)}}
.lcol{position:relative}
.blk{position:relative;display:flex;flex-direction:column;min-width:0}
.blk>.box{flex:1}
@media(min-width:900px){.lcol>.blk:last-of-type{flex:1}.blk.fixh>:first-child{height:var(--h);overflow:auto;flex:none}}
.bmove,.bsz,.csz{display:none}
.layctl{display:none;align-items:center;gap:10px;justify-content:flex-end;margin:-4px 0 8px;font-size:.85rem;color:var(--muted)}
.layctl .btn{padding:3px 12px;font-size:.85rem}
.layhelp{display:none;flex:1}
@media(min-width:900px){
 .layctl{display:flex}
 body.editlay .layhelp{display:block}
 body.editlay .lcol{min-height:80px;outline:1px dashed var(--line);outline-offset:4px;border-radius:6px}
 body.editlay .blk{outline:1.5px dashed var(--accent);outline-offset:2px;border-radius:6px}
 body.editlay .blk.dragging{opacity:.75}
 body.editlay .bmove{display:grid;place-items:center;position:absolute;top:-9px;left:-9px;z-index:6;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);cursor:grab;touch-action:none;user-select:none;font-size:.95rem;box-shadow:0 1px 4px rgba(0,0,0,.3)}
 body.editlay .bsz{display:block;position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);z-index:6;width:46px;height:10px;border-radius:6px;background:var(--accent);cursor:ns-resize;touch-action:none}
 body.editlay .csz{display:block;position:absolute;top:0;bottom:0;right:-10px;z-index:5;width:7px;border-radius:4px;background:var(--line);cursor:ew-resize;touch-action:none}
 body.editlay .csz:hover{background:var(--accent)}
}

/* abilities */
.abils{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.abil{background:var(--sheet);border:1px solid var(--line);border-radius:14px 14px 40px 40px/14px 14px 22px 22px;text-align:center;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center}
.abil .an{font-family:"Alegreya SC",Georgia,serif;font-size:.85rem;color:var(--muted)}
.abil input{width:100%;text-align:center;border:0;background:transparent;font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:2.3rem;line-height:1;margin:2px 0 6px;padding:0}
.abil .am{min-width:3.2em;text-align:center;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:2px 0;font-weight:700}

/* small stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:10px;text-align:center;padding:8px 4px 4px;display:flex;flex-direction:column;justify-content:space-between}
.tile .big{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:1.9rem;line-height:1.1}
.tile input{text-align:center;border:0;background:transparent;width:100%;font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:1.9rem;line-height:1.1;padding:0}
.tile .fl{text-align:center}
.shield{border-radius:10px 10px 50% 50%/10px 10px 30% 30%}

.row2{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.row2 .insp{flex:1 1 130px;min-width:0}
.row2 .insp label{line-height:1.2}
.insp{display:flex;align-items:center;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.insp label{display:flex;align-items:center;gap:8px;font-family:"Alegreya SC",Georgia,serif}
.insp input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.profin{flex:none;width:2.6em;text-align:center;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-weight:700;padding:2px 0}

/* checks */
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px dotted var(--soft)}
.checks li:last-child{border-bottom:0}
.checks input{width:18px;height:18px;accent-color:var(--ink);margin:0;flex:none}
.checks .v{width:2.4em;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.checks .ab{color:var(--muted);font-size:.85rem;margin-left:auto}
.checks label{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer}
.passive{display:flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px}
.passive .big{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:1.05rem;width:2em;height:2em;flex:none;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.passive .sc{font-size:.78rem;line-height:1.2;color:var(--muted)}

/* hp */
.hp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.hp .cur input{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:2.6rem;text-align:center;border-bottom:2px solid var(--ink)}
.hp .fld input{text-align:center}
.ds{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:.9rem}

/* pips */
.pips{display:inline-flex;gap:5px;flex-wrap:wrap;vertical-align:middle}.ds .pips{flex-wrap:nowrap}
.pip{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;padding:0}
.pip.on{background:var(--ink)}
.pips.red .pip{border-color:var(--accent)}.pips.red .pip.on{background:var(--accent)}

/* entries */
.list{display:flex;flex-direction:column}
.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--muted);padding:2px 4px;font-size:1.05rem;line-height:1;flex:none;border-radius:4px}
.grip:hover{color:var(--ink)}
.dragging{background:var(--soft);cursor:grabbing}
.dragging .grip{cursor:grabbing}
.tl,.wn{display:flex;align-items:center;gap:6px;min-width:0}
@media print{.grip{display:none}}
.erow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--soft)}
.ename{background:none;border:0;padding:0;text-align:left;font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.ename:hover{color:var(--accent)}
.ename.norule{text-decoration-color:var(--line);font-weight:500}
.erow .atk{font-variant-numeric:tabular-nums;font-weight:700;margin-left:auto}
.erow .dmg{color:var(--muted);min-width:7.5em;text-align:right}
.erow .note{color:var(--muted);font-size:.88rem;font-style:italic}
.erow .pips{margin-left:auto}
.erow.spell input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin:0}
.add{background:none;border:1px dashed var(--line);border-radius:6px;color:var(--muted);padding:6px;margin-top:10px}
.add:hover{color:var(--ink);border-color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 6px}

/* attacks table */
.scroll{overflow-x:auto}
.atable{width:100%;border-collapse:collapse;font-size:.92rem}
.atable th{text-align:left;font-family:"Alegreya SC",Georgia,serif;font-size:.78rem;letter-spacing:.05em;color:var(--muted);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line)}
.atable td{padding:7px 6px;border-bottom:1px solid var(--soft);vertical-align:top}
.atable td.n{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.atable td.d{white-space:nowrap}
.atable .empty td{color:var(--muted);font-style:italic}
.rl{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.rl:hover{color:var(--accent)}
/* tracker */
.trk{display:flex;flex-direction:column}
.tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--soft)}
.tr .tn{display:flex;flex-direction:column;min-width:0}
.tr .rl{font-weight:700}
.tr .sub{font-size:.82rem;color:var(--muted)}
.tr .pip{width:22px;height:22px}
.pool{display:flex;align-items:center;gap:6px;color:var(--muted)}
.pool input{width:4em;text-align:center;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:2px 0;color:var(--ink);font-weight:700}
.rests{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;margin-top:10px}
.rests .sub{font-size:.82rem;color:var(--muted)}
.rests .btn{padding:4px 12px;font-size:.9rem}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 0}
.opts label{display:flex;align-items:center;gap:6px}
.opts input{width:17px;height:17px;accent-color:var(--accent);margin:0}

.b-notes textarea{width:100%;min-height:180px;background:transparent;border:1px solid var(--soft);border-radius:6px;padding:8px;resize:vertical;line-height:1.45}
.coins{display:grid;grid-template-columns:repeat(auto-fit,minmax(42px,1fr));gap:6px;margin-top:12px}
.coins .fld input{text-align:center}
.coins .fl{text-align:center}

/* story */
.story{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.story{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}}
.phys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px}

/* spells */
.spellhead{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media(min-width:760px){.spellhead{grid-template-columns:2fr 1.3fr 1fr 1fr}}
.spellgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.spellgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1060px){.spellgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lvl summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px}
.lvl summary::-webkit-details-marker{display:none}
.lvl .ln{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:1.6rem;width:1.6em;height:1.6em;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;flex:none;line-height:1}
.lvl .lt{font-family:"Alegreya SC",Georgia,serif;flex:1}
.lvl .cnt{color:var(--muted);font-size:.85rem}
.lvl .body{padding-top:0}
.slots{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 4px;font-size:.9rem;color:var(--muted)}
.slots input{width:3em;text-align:center;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:1px 0;color:var(--ink);font-weight:700}

.foot{margin-top:28px;display:flex;justify-content:center}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--sheet);color:var(--ink);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 40px rgba(0,0,0,.25);animation:up .18s ease-out}
@media(min-width:700px){.ov{align-items:center;padding:20px}.modal{border-radius:14px 4px 14px 4px;max-height:84vh;animation:none}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.modal{animation:none}}
.mhead{display:flex;align-items:flex-start;gap:10px}
.mhead h2{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:1.75rem;line-height:1.15;margin:0;flex:1}
.x{background:none;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:1.2rem;line-height:1;flex:none}
.tag{color:var(--bronze);font-family:"Alegreya SC",Georgia,serif;margin:4px 0 0}
.mmeta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.9rem}
.chip b{font-variant-numeric:tabular-nums}
.rules{font-family:"Alegreya",Georgia,serif;font-size:1.05rem;line-height:1.6;margin-top:14px;border-top:1px solid var(--soft);padding-top:6px;max-width:62ch}
.rules p{margin:10px 0}
.empty{color:var(--muted);font-style:italic}
.mact{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.mact .sp{flex:1}
.form{display:grid;gap:12px;margin-top:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .form textarea{min-height:220px}
.msg{font-size:.88rem;color:var(--accent);min-height:1.2em}

/* compact layout on tablets and desktops */
@media(min-width:760px){
 html{font-size:14px}
 body{font-size:15px;line-height:1.35}
 .bar-in{padding:5px 14px}
 .tab{padding:4px 12px}
 main{padding:10px 12px 40px}
 .head{gap:10px;margin-bottom:10px}
 .meta{gap:4px 14px}
 .cname input{font-size:2rem}
 .lay,.band,.col{gap:10px}
 .box>.body{padding:8px 10px}
 .lab{padding:2px 8px 3px}
 .fld input,.fld select{padding:2px}
 .abils{gap:6px}
 .abil{padding:4px 6px 6px}
 .abil input{font-size:1.9rem;margin:0 0 3px}
 .tiles{gap:8px}
 .tile{padding:5px 4px 3px}
 .tile .big,.tile input{font-size:1.6rem}
 .insp{padding:5px 10px}
 .checks li{padding:1px 0}
 .checks input{width:16px;height:16px}
 .hp .cur input{font-size:2.1rem}
 .erow{padding:4px 0}
 .atable td{padding:4px 5px}
 .tr{padding:4px 0}
 .tr .pip{width:18px;height:18px}
 .add{padding:3px;margin-top:6px}
 .hint{margin:0 0 3px}
 .rests{margin-top:6px}
 .coins{margin-top:8px}
 .notes textarea{min-height:140px}
 .spellhead{gap:10px;margin-bottom:10px}
 .spellgrid,.story{gap:10px}
 .lvl summary{padding:6px 10px}
 .lvl .ln{font-size:1.35rem}
}

/* print / PDF */
@page{margin:12mm}
@media print{
 :root,:root[data-theme="dark"],:root:not([data-theme="light"]){--paper:#fff;--sheet:#fff;--ink:#1B2130;--muted:#586070;--line:#B0B6C0;--soft:#D5DAE0;--accent:#8C2A22;--accent-ink:#FFF6F3;--bronze:#7E6128;color-scheme:light}
 body{background:#fff;font-size:13px}
 .bar,.foot,.add,.rests,.hint,.ov,.layctl,.bmove,.bsz,.csz{display:none!important}
 main{max-width:none;padding:0}
 .page[hidden]{display:block!important}
 .page+.page{break-before:page}
 .box,.abil,.tile,.tr,.atable tr{break-inside:avoid}
 .scroll{overflow:visible}

 "prepared": true}, {"name": "Alarm", "note": "Ward an area for 8 hours"}, {"name": "Animal Friendship", "note": "Charm a Beast, Wis save"}, {"name": "Detect Magic", "note": "30 ft, 10 min · conc."}, {"name": "Detect Poison and Disease", "note": "30 ft, 10 min · conc."}, {"name": "Fog Cloud", "note": "20-ft fog sphere · conc."}, {"name": "Jump", "note": "30-ft jumps for 1 minute"}, {"name": "Speak with Animals", "note": "Talk with Beasts, 10 min"}]}, {"slots": "", "used": 0, "list": [{"name": "Aid", "note": "Unlocks at ranger level 5"}, {"name": "Animal Messenger", "note": "Unlocks at ranger level 5"}, {"name": "Barkskin", "note": "Unlocks at ranger level 5"}, {"name": "Beast Sense", "note": "Unlocks at ranger level 5"}, {"name": "Cordon of Arrows", "note": "Unlocks at ranger level 5"}, {"name": "Darkvision", "note": "Unlocks at ranger level 5"}, {"name": "Enhance Ability", "note": "Unlocks at ranger level 5"}, {"name": "Find Traps", "note": "Unlocks at ranger level 5"}, {"name": "Gust of Wind", "note": "Unlocks at ranger level 5"}, {"name": "Lesser Restoration", "note": "Unlocks at ranger level 5"}, {"name": "Locate Animals or Plants", "note": "Unlocks at ranger level 5"}, {"name": "Locate Object", "note": "Unlocks at ranger level 5"}, {"name": "Magic Weapon", "note": "Unlocks at ranger level 5"}, {"name": "Pass without Trace", "note": "Unlocks at ranger level 5 · free from Wood Elf"}, {"name": "Protection from Poison", "note": "Unlocks at ranger level 5"}, {"name": "Silence", "note": "Unlocks at ranger level 5"}, {"name": "Spike Growth", "note": "Unlocks at ranger level 5"}, {"name": "Summon Beast", "note": "Unlocks at ranger level 5"}]}, {"slots": "", "used": 0, "list": []}, {"slots": "", "used": 0, "list": []}, {"slots": "", "used": 0, "list": []}, {"slots": "", "used": 0, "list": []}, {"slots": "", "used": 0, "list": []}, {"slots": "", "used": 0, "list": []}, {"slots": "", "used": 0, "list": []}]}, "lib": {"concentration": {"name": "Concentration", "tag": "Spellcasting rule", "text": "You can concentrate on only one spell at a time; casting another concentration spell ends the first.\n\nWhen you take damage, make a Constitution save to keep concentrating: DC 10 or half the damage taken, whichever is higher (max 30). Concentration also ends if you are incapacitated or die."}, "prone": {"name": "Prone", "tag": "Condition", "text": "The creature can only crawl, or spend half its speed to stand up.\n\nDisadvantage on its attack rolls. Attacks against it have advantage within 5 feet, and disadvantage from farther away."}, "darkvision": {"name": "Darkvision", "tag": "Trait", "text": "You can see in dim light within range as if it were bright light, and in darkness as if it were dim light. You see only shades of gray in darkness."}, "common": {"name": "Common", "tag": "Language", "aka": ["commonlanguage"], "text": "The widely spoken trade language of most lands. Written with the Common script."}, "quiver": {"name": "Quiver", "tag": "Adventuring gear", "text": "Holds up to 20 arrows (or bolts in some editions), keeping them at hand for drawing."}, "slow": {"name": "Slow", "tag": "Weapon mastery (2024)", "text": "When you hit a creature and deal damage, its speed is reduced by 10 feet until the start of your next turn. Multiple hits don't reduce it beyond 10 feet."}, "detectmagic": {"name": "Detect Magic", "tag": "1st level · Divination · Ritual · Action · Self · Concentration, 10 minutes", "text": "You sense magic within 30 ft. As an action you can see a faint aura around any visible magical creature or object and learn its school of magic. Same blocking as Detect Evil and Good."}, "detectpoisonanddisease": {"name": "Detect Poison and Disease", "tag": "1st level · Divination · Ritual · Action · Self · Concentration, 10 minutes", "text": "You sense the location of poisons, poisonous or venomous creatures, and magical contagions within 30 ft, and identify each kind."}, "curewounds": {"name": "Cure Wounds", "tag": "1st level · Abjuration · Action · Touch", "text": "A creature you touch regains 2d8 + your Wisdom modifier hit points (2d8+3 for you). Works on Borge.\n\nHigher slots: +2d8 per slot level above 1st."}, "longbow": {"name": "Longbow", "tag": "Martial ranged weapon", "text": "1d8 piercing. Ammunition, range 150/600 ft, heavy, two-handed. 2 lb.\n\nAttack bonus: Dexterity modifier + proficiency bonus (+2 more from Archery).\n\nWeapon mastery (2024): Slow. On a hit that deals damage, the target's speed drops by 10 ft until the start of your next turn."}, "shortbow": {"name": "Shortbow", "tag": "Simple ranged weapon", "text": "1d6 piercing. Ammunition, range 80/320 ft, two-handed. 2 lb. Backup bow from the Guide background.\n\nMastery: Vex (you don't have it mastered)."}, "shortsword": {"name": "Shortsword", "tag": "Martial melee weapon", "text": "1d6 piercing. Finesse, light. 2 lb.\n\nWeapon mastery (2024): Vex. When you hit and deal damage, you have advantage on your next attack roll against that creature before the end of your next turn."}, "scimitar": {"name": "Scimitar", "tag": "Martial melee weapon", "text": "1d6 slashing. Finesse, light. 3 lb.\n\nMastery: Nick (you don't have it mastered). Light, so you can fight with it and the shortsword together: the extra attack with the off-hand weapon is a bonus action and doesn't add your ability modifier to damage."}, "arrows": {"name": "Arrows", "tag": "Ammunition", "text": "Used with a bow. After a fight, you can spend a minute to recover half the arrows you fired.", "aka": ["arrow"]}, "studdedleatherarmor": {"name": "Studded leather armor", "tag": "Light armor", "text": "AC 12 + Dexterity modifier (16 for you). No Stealth penalty. 13 lb.", "aka": ["studdedleather"]}, "explorerspack": {"name": "Explorer's pack", "tag": "Equipment pack", "text": "Backpack, bedroll, 2 flasks of oil, 10 days of rations, rope (50 ft), tinderbox, 10 torches, waterskin."}, "sprigofmistletoe": {"name": "Sprig of mistletoe", "tag": "Druidic focus", "text": "Your spellcasting focus for ranger spells. It replaces material components that have no listed cost.", "aka": ["mistletoe"]}, "cartographerstools": {"name": "Cartographer's tools", "tag": "Artisan's tools · Guide", "text": "Ink, quill, parchment, compass, calipers and ruler. Proficiency lets you add your proficiency bonus to checks to draw maps, read them, or work out where you are.\n\nUtilize action: draw a map of an area (DC 15 Intelligence)."}, "tent": {"name": "Tent", "tag": "Adventuring gear", "text": "A two-person canvas shelter."}, "bedroll": {"name": "Bedroll", "tag": "Adventuring gear", "text": "Sleeping roll. One is in your explorer's pack and one came with the Guide background."}, "travelersclothes": {"name": "Traveler's clothes", "tag": "Clothing", "text": "Sturdy clothes for the road."}, "druidcraft": {"name": "Druidcraft", "tag": "Cantrip · Transmutation · Action · 30 ft · Wood Elf", "text": "Small nature magic: predict the weather for the next 24 hours, make a flower bloom or a seed sprout, create a harmless sensory effect (falling leaves, a puff of wind, an animal sound), or light or snuff a candle, torch or small campfire."}, "guidance": {"name": "Guidance", "tag": "Cantrip · Divination · Action · Touch · Concentration, 1 minute · Magic Initiate", "text": "Choose a skill. Until the spell ends, the willing creature you touch adds 1d4 to ability checks that use that skill."}, "thornwhip": {"name": "Thorn Whip", "tag": "Cantrip · Transmutation · Action · 30 ft · Magic Initiate", "text": "A thorny vine lashes out. Make a melee spell attack (+5) against a creature within 30 ft: 1d6 piercing, and if it's Large or smaller you can pull it up to 10 ft toward you. Your harpoon: drag an enemy into Borge's reach.\n\nDamage rises to 2d6 at level 5."}, "healingword": {"name": "Healing Word", "tag": "1st level · Abjuration · Bonus action · 60 ft · Magic Initiate", "text": "A creature you can see regains 2d4 + your Wisdom modifier hit points (2d4+3).\n\nCast it once per long rest without a slot, or with a ranger spell slot. Always prepared.\n\nHigher slots: +2d4 per slot level above 1st."}, "huntersmark": {"name": "Hunter's Mark", "tag": "1st level · Divination · Bonus action · 90 ft · Concentration, 1 hour", "text": "Mark a creature you can see. Your weapon hits on it deal an extra 1d6 force damage, and you have advantage on Wisdom (Perception or Survival) checks to find it. If it drops to 0 HP, you can move the mark to a new creature with a bonus action.\n\nFavored Enemy: always prepared, and you can cast it twice per long rest without a slot.\n\nHigher slots: longer duration (3rd–4th: 8 hours, 5th+: 24 hours)."}, "longstrider": {"name": "Longstrider", "tag": "1st level · Transmutation · Action · Touch · 1 hour", "text": "The creature's speed increases by 10 ft. No concentration.\n\nWood Elf: once per long rest without a slot, and always prepared.\n\nHigher slots: one more target per slot level above 1st."}, "ensnaringstrike": {"name": "Ensnaring Strike", "tag": "1st level · Conjuration · Bonus action · Self · Concentration, 1 minute", "text": "Cast right after you hit a creature with a weapon, including your bow. Vines burst around it: Strength save (DC 13) or it's restrained. Large or bigger creatures have advantage. While restrained, it takes 1d6 piercing at the start of each of its turns. It (or someone touching it) can use an action for a Strength (Athletics) check against your DC to tear free.\n\nHigher slots: +1d6 per slot level above 1st."}, "entangle": {"name": "Entangle", "tag": "1st level · Conjuration · Action · 90 ft · Concentration, 1 minute", "text": "Grasping plants fill a 20-ft square. The area is difficult terrain. Each creature in it when it appears makes a Strength save (DC 13) or is restrained. A restrained creature can use an action for a Strength (Athletics) check against your DC to free itself."}, "goodberry": {"name": "Goodberry", "tag": "1st level · Conjuration · Action · Self", "text": "Ten magic berries appear in your hand and last 24 hours. Eating one (a bonus action) restores 1 hit point and nourishes a creature for a whole day."}, "alarm": {"name": "Alarm", "tag": "1st level · Abjuration · 1 minute · 30 ft · 8 hours", "text": "Ward a door, window or area no bigger than a 20-ft cube. When a creature you didn't exclude touches or enters it, you get a mental ping (it wakes you) or an audible alarm that rings for 10 seconds within 60 ft."}, "animalfriendship": {"name": "Animal Friendship", "tag": "1st level · Enchantment · Action · 30 ft · 24 hours", "text": "A Beast you can see makes a Wisdom save (DC 13) or is charmed by you for the duration. The spell ends if you or your allies hurt it.\n\nHigher slots: one more Beast per slot level above 1st."}, "fogcloud": {"name": "Fog Cloud", "tag": "1st level · Conjuration · Action · 120 ft · Concentration, 1 hour", "text": "A 20-ft-radius sphere of fog that is heavily obscured. A strong wind disperses it. Careful: it blocks your own shots too.\n\nHigher slots: radius +20 ft per slot level above 1st."}, "jump": {"name": "Jump", "tag": "1st level · Transmutation · Bonus action · Touch · 1 minute", "text": "Once on each of its turns, the target can jump up to 30 ft by spending 10 ft of movement.\n\nHigher slots: one more target per slot level above 1st."}, "speakwithanimals": {"name": "Speak with Animals", "tag": "1st level · Divination · Action · Self · 10 minutes", "text": "You can understand and talk with Beasts. Most know little beyond their surroundings, but can tell you about nearby places and creatures they've seen recently."}, "spikegrowth": {"name": "Spike Growth", "tag": "2nd level · Transmutation · Action · 150 ft · Concentration, 10 minutes", "text": "A 20-ft-radius area sprouts hidden spikes and thorns. It's difficult terrain, and a creature takes 2d4 piercing for every 5 ft it moves through it. The area is hard to spot: a Wisdom (Perception) check against your spell DC. The best trap in the game, and perfect with Thorn Whip pulling enemies through it."}, "passwithouttrace": {"name": "Pass without Trace", "tag": "2nd level · Abjuration · Action · Self · Concentration, 1 hour", "text": "An aura of shadow within 30 ft of you gives you and your allies +10 to Dexterity (Stealth) checks, and they can't be tracked except by magic.\n\nWood Elf at level 5: once per long rest without a slot, and always prepared."}, "borge": {"name": "Borge", "tag": "Primal Companion · Beast of the Land · wolverine", "text": "Medium Beast. Acts on your turn.\n\nAC 16 (13 + your Wis) · HP 20 (5 + 5 × your ranger level) · Speed 40 ft, climb 40 ft.\nStr 14 · Dex 14 · Con 15 · Int 8 · Wis 14 · Cha 11. Darkvision 60 ft. Understands the languages you know.\n\nPrimal Bond: add your proficiency bonus (+2) to his ability checks and saving throws.\n\nCharge: if Borge moves at least 20 ft straight toward a target and then hits it with Rend on the same turn, it takes an extra 1d6 slashing and, if Large or smaller, falls prone.\n\nRend (Beast's Strike): melee attack +5 (your spell attack), reach 5 ft. Hit: 1d8 + 2 + your Wis modifier = 1d8+5 slashing.\n\nCommanding him: without orders he only moves and takes the Dodge action. Spend a bonus action to have him Rend (or take another action). From level 5, you can also give up one of your attacks to command a Rend. If you're incapacitated, he acts on his own.\n\nIf he dies: within 1 hour, touch him, take a Magic action and spend a spell slot. He returns with full HP after 1 minute. Or summon him again at the end of a long rest.", "aka": ["borgethewolverine", "primalcompanion", "rend"]}, "archery": {"name": "Archery", "tag": "Fighting style", "text": "+2 bonus to attack rolls you make with ranged weapons."}, "favoredenemy": {"name": "Favored Enemy", "tag": "Ranger 1", "text": "Hunter's Mark is always prepared. You can cast it twice per long rest without a spell slot. The count rises with level (3 at level 5, 4 at level 9, 5 at level 13, 6 at level 17)."}, "weaponmastery": {"name": "Weapon Mastery", "tag": "Ranger 1", "text": "You can use the mastery properties of two kinds of weapons: right now the Longbow (Slow) and Shortsword (Vex). After a long rest you can swap one choice."}, "deftexplorer": {"name": "Deft Explorer", "tag": "Ranger 2", "text": "Expertise in one skill you're proficient in (Perception: double proficiency, +7). You also learn two languages (Sylvan and Orc)."}, "magicinitiate": {"name": "Magic Initiate (Druid)", "tag": "Origin feat · Guide", "text": "Two druid cantrips (Guidance, Thorn Whip) and one 1st-level druid spell (Healing Word) that is always prepared. Cast Healing Word once per long rest for free, or with your spell slots. Wisdom is your spellcasting ability for them. When you gain a level, you can swap one of these choices."}, "feyancestry": {"name": "Fey Ancestry", "tag": "Elf trait", "text": "You have advantage on saving throws you make to avoid or end the charmed condition."}, "keensenses": {"name": "Keen Senses", "tag": "Elf trait", "text": "Proficiency in Perception (one of Insight, Perception or Survival)."}, "trance": {"name": "Trance", "tag": "Elf trait", "text": "You don't need to sleep, and magic can't put you to sleep. You can finish a long rest in 4 hours of trance-like meditation, staying conscious."}, "woodelf": {"name": "Wood Elf", "tag": "Elven lineage", "text": "Speed 35 ft. Druidcraft cantrip. Longstrider at level 3 and Pass without Trace at level 5, each always prepared and castable once per long rest without a slot. Wisdom is your spellcasting ability for these.", "aka": ["elvenlineage", "woodelflineage"]}, "restrained": {"name": "Restrained", "tag": "Condition", "text": "Speed 0. Attack rolls against the creature have advantage, and its own attack rolls have disadvantage. Disadvantage on Dexterity saving throws."}, "charmed": {"name": "Charmed", "tag": "Condition", "text": "The creature can't attack the charmer or target it with harmful effects. The charmer has advantage on social checks against it."}, "sharpshooter": {"name": "Sharpshooter", "tag": "Feat (level 4 plan)", "text": "+1 Dexterity. Your ranged weapon attacks ignore half and three-quarters cover, attacking at long range doesn't give disadvantage, and being within 5 ft of an enemy doesn't give disadvantage on ranged attacks."}}}</script><script id="app">

  if(!isNew){let armed=false;const del=h('button',{type:'button',class:'btn danger'},'Delete');del.addEventListener('click',()=>{if(!armed){armed=true;del.textContent='Tap again to delete';return}const arr=gp(key);arr.splice(i,1);changed();rr();close()});act.append(del)}
  act.append(h('button',{type:'button',class:'btn ghost',onclick:()=>{if(ctrl)ctrl.abort();isNew?close():view()}},'Cancel'));
  act.append(h('button',{type:'button',class:'btn accent',onclick:()=>{

   const arr=gp(key);if(i<0){arr.push(it);i=arr.length-1}else arr[i]=it;it=Object.assign({},arr[i]);

/* sheet layout: boxes live in columns inside bands; S.layout stores order, column widths and fixed heights */
const BOX_IDS=['abils','passive','top','saves','skills','tiles','hp','hd','attacks','profs','features','equip','notes'];
const DEF_LAYOUT=()=>({bands:[{w:[.5,1,1.15,1],cols:[['abils','passive'],['top','saves','skills'],['tiles','hp','hd','attacks'],['profs','features']]},{w:[1.5,2.15],cols:[['equip'],['notes']]}],h:{}});
let EDIT=false;
function getLayout(){const L=S.layout&&Array.isArray(S.layout.bands)?JSON.parse(JSON.stringify(S.layout)):DEF_LAYOUT();const seen=new Set();
 L.bands.forEach(b=>{b.cols=b.cols.map(c=>c.filter(id=>BOX_IDS.includes(id)&&!seen.has(id)&&seen.add(id)))});
 BOX_IDS.forEach(id=>{if(!seen.has(id)){const c=L.bands[0].cols;c[c.length-1].push(id)}});L.h=L.h||{};return L}
function layoutView(content){const L=getLayout();const lay=h('div',{class:'lay'});
 const commit=()=>{S.layout=L;changed()};
 const colsCss=b=>b.w.map(x=>'minmax(0,'+x.toFixed(3)+'fr)').join(' ');
 const drag=(e,onMove,onUp)=>{if(e.button)return;e.preventDefault();const pid=e.pointerId,x0=e.clientX,y0=e.clientY;
  const mv=ev=>{if(ev.pointerId===pid)onMove(ev,ev.clientX-x0,ev.clientY-y0)};
  const up=ev=>{if(ev.pointerId!==pid)return;window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);onUp()};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)};
 const B={};
 for(const id of BOX_IDS){const blk=h('div',{class:'blk b-'+id,'data-b':id},content[id]);
  if(L.h[id]){blk.classList.add('fixh');blk.style.setProperty('--h',L.h[id]+'px')}
  const mvh=h('span',{class:'bmove',title:'Drag to move this box'},'⠿');
  mvh.addEventListener('pointerdown',e=>{blk.classList.add('dragging');drag(e,ev=>{
    if(ev.clientY<60)window.scrollBy(0,-14);else if(ev.clientY>window.innerHeight-40)window.scrollBy(0,14);
    const col=document.elementsFromPoint(ev.clientX,ev.clientY).find(x=>x.classList&&x.classList.contains('lcol'));if(!col)return;
    const items=[...col.children].filter(x=>x.dataset.b&&x!==blk);let before=null;
    for(const it of items){const r=it.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){before=it;break}}
    if(before){if(blk.nextSibling!==before)col.insertBefore(blk,before)}
    else if(items.length){const last=items[items.length-1];if(last.nextSibling!==blk)last.after(blk)}
    else if(blk.parentNode!==col)col.prepend(blk)},
   ()=>{blk.classList.remove('dragging');[...lay.children].forEach((band,bi)=>{L.bands[bi].cols=[...band.children].filter(c=>c.classList.contains('lcol')).map(c=>[...c.children].filter(x=>x.dataset.b).map(x=>x.dataset.b))});commit()})});
  const szh=h('span',{class:'bsz',title:'Drag to change height. Double-click to reset.'});
  szh.addEventListener('pointerdown',e=>{const h0=content[id].getBoundingClientRect().height;let nh=h0;drag(e,(ev,dx,dy)=>{nh=Math.max(50,Math.round(h0+dy));blk.classList.add('fixh');blk.style.setProperty('--h',nh+'px')},()=>{L.h[id]=nh;commit()})});
  szh.addEventListener('dblclick',()=>{delete L.h[id];blk.classList.remove('fixh');blk.style.removeProperty('--h');commit()});
  blk.append(mvh,szh);B[id]=blk}
 L.bands.forEach((b,bi)=>{const band=h('div',{class:'band'});band.style.setProperty('--cols',colsCss(b));
  b.cols.forEach((ids,ci)=>{const col=h('div',{class:'col lcol'},ids.map(id=>B[id]));
   if(ci<b.cols.length-1){const cz=h('span',{class:'csz',title:'Drag to change column widths. Double-click to reset.'});
    cz.addEventListener('pointerdown',e=>{const w0=b.w.slice(),tot=w0.reduce((a,c)=>a+c,0),per=tot/band.getBoundingClientRect().width,min=tot*.07;
     drag(e,(ev,dx)=>{let a=w0[ci]+dx*per,c=w0[ci+1]-dx*per;if(a<min){c-=min-a;a=min}if(c<min){a-=min-c;c=min}b.w[ci]=a;b.w[ci+1]=c;band.style.setProperty('--cols',colsCss(b))},commit)});
    cz.addEventListener('dblclick',()=>{const d=DEF_LAYOUT().bands[bi];if(d&&d.w.length===b.w.length){b.w=d.w.slice();band.style.setProperty('--cols',colsCss(b));commit()}});
    col.append(cz)}
   band.append(col)});
  lay.append(band)});
 const tog=h('button',{type:'button',class:'btn ghost'},EDIT?'Done':'Edit layout');
 tog.addEventListener('click',()=>{EDIT=!EDIT;document.body.classList.toggle('editlay',EDIT);tog.textContent=EDIT?'Done':'Edit layout'});
 const reset=h('button',{type:'button',class:'btn ghost'},'Reset layout');
 reset.addEventListener('click',()=>{delete S.layout;changed();const y=window.scrollY;render();window.scrollTo(0,y)});
 const ctl=h('div',{class:'layctl'},h('span',{class:'layhelp'},'Drag a red ⠿ to move a box. Drag the bar under a box, or between columns, to resize. Double-click a bar to reset it.'),reset,tog);
 return h('div',null,ctl,lay)}

  const d=h('details',{class:'box lvl',open:(has||lv<=1)?true:null});

  if(lv===1)body.append(h('p',{class:'hint'},'Tick the box to mark a spell prepared.'));

 return h('div',null,hd,grid);
